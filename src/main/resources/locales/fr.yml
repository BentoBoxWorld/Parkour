    description: "Choisissez-en un et essayez !"
    gui-title: "Cours de Parkour"
    head-description: "<aqua>[runs] essais</aqua>"
  top:
    gui-title: "Classement des Cours les Plus Rapides"
    name-rank: "<aqua>[rank] - </aqua><light_purple>[name]</light_purple>"
    description: "<yellow>[number]</yellow>"
    your-rank: "<green>Votre classement : [number]</green>"
    beat-previous-time: "<light_purple>Vous avez battu votre temps précédent !</light_purple>"
    did-not-beat-previous-time: "<aqua>Vous n'avez pas battu votre temps précédent !</aqua>"
  errors:
    not-on-island: "<red>Vous devez être sur un cours de parkour pour faire cela</red>"
    no-warp: "<red>Ce cours est déjà privé</red>"
    not-in-run: "<red>Vous devez actuellement participer à un cours pour faire cela</red>"

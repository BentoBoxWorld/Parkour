      courses:
        description: afficher les cours disponibles à jouer et pour se téléporter
      cleartop:
        description: effacer le classement des dix meilleurs de votre cours ou supprimer le score d'un joueur
        parameters: <nom du joueur>
      setwarp:
        description: définit le point de téléportation et rend votre cours public
      warp:
        description: Se téléporter vers un cours par son nom ou au début si vous êtes dans un
        parameters: <nom du cours>
      removewarp:
        description: supprime le point de téléportation et rend votre cours privé
      help:
        description: Commencer un cours de parkour ou se téléporter vers votre cours
      go:
        parameters: '[numéro du foyer]'
      sethome:
        parameters: '[numéro du foyer]'
      top:
        description: "Afficher le classement des meilleurs cours"
      quit:
        description: "Arrêter le chronomètre du cours actuel"

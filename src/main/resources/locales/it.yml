          estimated-time: '<green>Tempo stimato: </green><aqua>[number] </aqua><green>secondi.</green>'
          blocks: '<green>Costruendo blocco per blocco: </green><aqua>[number] </aqua><green>blocchi in tutto...</green>'
          entities: '<green>Riempiendo con entità: </green><aqua>[number] </aqua><green>entità in tutto...</green>'
          done: '<green>Fatto! Il tuo corso è pronto e ti aspetta!</green>'
        pick: '<dark_green>Scegli un corso</dark_green>'
        unknown-blueprint: '<red>Quello schema non è ancora stato caricato.</red>'
        on-first-login: '<green>Benvenuto! Inizieremo a preparare il tuo corso tra qualche secondo.</green>'
        you-can-teleport-to-your-island: '<green>Puoi teletrasportarti al tuo corso quando vuoi.</green>'
      info:
        description: mostra informazioni sul tuo corso o sul corso del giocatore
        parameters: <giocatore>
      near:
        description: mostra il nome dei corsi vicini intorno a te
        parameters: ''
        the-following-islands: '<green>I seguenti corsi sono vicini:</green>'
        syntax: '<gold>[direction]: </gold><green>[name]</green>'
        north: Nord
        south: Sud
        east: Est
        west: Ovest
        no-neighbors: '<red>Non hai corsi vicini immediati!</red>'
      reset:
        description: ripristina il tuo corso ed elimina quello vecchio
        parameters: <schema>
        none-left: '<red>Non hai più ripristini!</red>'
        resets-left: '<red>Hai ancora </red><aqua>[number] </aqua><red>ripristini</red>'
        confirmation: |-
          <red>Sei sicuro di volerlo fare?
          </red><red>Tutti i membri del corso verranno espulsi, dovrai reinvitarli dopo.
          </red><red>Non c'è ritorno: una volta eliminato il tuo corso attuale, non ci sarà <bold>nessun </bold></red> <red>modo di recuperarlo in seguito.</red>

        cannot-create-island: '<red>Non è stato possibile trovare un posto in tempo, riprova...</red>'
        unable-create-island: '<red>Il tuo corso non ha potuto essere generato, contatta un amministratore.</red>'
        creating-island: '<green>Trovando un posto per il tuo corso...</green>'

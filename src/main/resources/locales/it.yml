        island-coords: 'Coordinate dell''area: [xz1] a [xz2]'
        is-spawn: L'area è un corso di spawn
      setrange:
        description: imposta il raggio del corso del giocatore
        range-updated: Raggio dell'area aggiornato a [number]
      tp:
        description: teletrasportati al corso di un giocatore
      getrank:
        description: ottieni il rango di un giocatore nel suo corso

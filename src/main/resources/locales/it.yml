  end-set: "<green>Punto di fine impostato!</green>"
  already-set: "<red>Inizio e fine sono già impostati! Distruggi uno per ripristinare.</red>"
  start-removed: "<aqua>Punto di inizio rimosso!</aqua>"
  end-removed: "<aqua>Punto di fine rimosso!</aqua>"
  resetting-start-end: "<yellow>Ripristino dei punti di inizio e fine!</yellow>"
  start: "<aqua>Inizio parkour!</aqua>"
  no-start-yet: "<red>Non c'è ancora un punto di inizio impostato.</red>"
  no-end-yet: "<red>Non c'è ancora un punto di fine impostato.</red>"

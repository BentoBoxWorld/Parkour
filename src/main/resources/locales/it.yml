  session-ended: "<red>La tua sessione di parkour è terminata.</red>"
  end: "<green>Fine parkour!</green>"
  you-took: "<light_purple>Hai impiegato [number]!</light_purple>"
  start-before-end: "<aqua>Devi iniziare prima di terminare!</aqua>"
  checkpoint: "<yellow>Punto di controllo!</yellow>"
  checkpoint-set: "<green>Punto di controllo impostato!</green>"
  set-the-end: "<red>Imposta il punto di fine</red>"
  hours: "ore"
  minutes: "minuti"
  seconds: "secondi"
  hours-short: "h"
  minutes-short: "m"
  seconds-short: "s"
  courses:
    description: "Scegline uno e provalo!"
    gui-title: "Corsi di Parkour"
    head-description: "<aqua>[runs] tentativi</aqua>"
  top:
    gui-title: "Classifica Corsi Più Veloci"
    name-rank: "<aqua>[rank] - </aqua><light_purple>[name]</light_purple>"
    description: "<yellow>[number]</yellow>"
    your-rank: "<green>Il tuo rango: [number]</green>"
    beat-previous-time: "<light_purple>Hai battuto il tuo tempo precedente!</light_purple>"
    did-not-beat-previous-time: "<aqua>Non hai battuto il tuo tempo precedente!</aqua>"
  errors:
    not-on-island: "<red>Devi essere su un corso di parkour per fare questo</red>"
    no-warp: "<red>Questo corso è già privato</red>"
    not-in-run: "<red>Devi attualmente correre un corso per fare questo</red>"
  warp:
    set: "<light_purple>Punto di teletrasporto impostato! I giocatori possono ora vedere il tuo corso!</light_purple>"
    replaced: "<yellow>Punto di teletrasporto impostato! Vecchio punto disattivato!</yellow>"
    removed: "<red>Punto di teletrasporto rimosso. I giocatori non vedranno più il tuo corso.</red>"

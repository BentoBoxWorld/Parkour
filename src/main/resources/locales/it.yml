      sethome:
        description: imposta il tuo punto di teletrasporto a casa
        must-be-on-your-island: '<red>Devi essere sul tuo corso per impostare una casa!</red>'
        num-homes: '<red>Le case possono essere da 1 a [number].</red>'
        home-set: '<gold>La casa del tuo corso è stata impostata sulla tua posizione attuale.</gold>'
        nether:
          not-allowed: '<red>Non sei autorizzato a impostare la tua casa nel Nether.</red>'
          confirmation: '<red>Sei sicuro di voler impostare la tua casa nel Nether?</red>'
        the-end:
          not-allowed: '<red>Non sei autorizzato a impostare la tua casa nell''End.</red>'
          confirmation: '<red>Sei sicuro di voler impostare la tua casa nell''End?</red>'
        parameters: '[numero casa]'

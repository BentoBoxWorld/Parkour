    no-warp: "<red>Non c'è un punto di teletrasporto impostato per questo corso!</red>"
    unknown-course: "<red>Corso sconosciuto!</red>"
  quit:
    success: "<yellow>Hai lasciato la tua sessione e puoi di nuovo usare i comandi</yellow>"
  general:
    errors:
      no-island: '<red>Non hai un corso!</red>'
      player-has-island: '<red>Il giocatore ha già un corso!</red>'
      player-has-no-island: '<red>Quel giocatore non ha un corso!</red>'
      already-have-island: '<red>Hai già un corso!</red>'
      no-safe-location: '<red>Nessun luogo sicuro trovato nel corso!</red>'
      not-owner: '<red>Non sei il proprietario della tua squadra!</red>'
  commands:
    parkour:
      courses:
        description: mostra i corsi disponibili da giocare e teletrasportarsi a
      cleartop:
        description: cancella i primi dieci del tuo corso o rimuove il punteggio di un giocatore
        parameters: <nome giocatore>
      setwarp:
        description: imposta il punto di teletrasporto e rende pubblico il tuo corso
      warp:
        description: Teletrasportati a un corso per nome o all'inizio se sei in uno
        parameters: <nome corso>
      removewarp:
        description: rimuove il punto di teletrasporto e rende privato il tuo corso
      help:
        description: Inizia un corso di parkour o teletrasportati al tuo corso
      go:
        parameters: '[numero casa]'
      sethome:
        parameters: '[numero casa]'
      top:
        description: "Mostra la classifica dei migliori corsi"
      quit:
        description: "Ferma il timer del corso attuale"

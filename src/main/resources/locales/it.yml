        description: imposta un nome per il tuo corso
        name-too-short: '<red>Troppo corto. La lunghezza minima è di [number] caratteri.</red>'
        name-too-long: '<red>Troppo lungo. La lunghezza massima è di [number] caratteri.</red>'
        name-already-exists: '<red>Esiste già un corso con quel nome!</red>'
        parameters: <nome>
        success: '<green>Il nome del tuo corso è stato impostato su </green><aqua>[name]</aqua><green>.</green>'

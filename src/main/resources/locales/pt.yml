            </white><green>Partículas verdes </green><white>mostram o alcance protegido padrão se o alcance de proteção for diferente dele.</white>
        set:
          description: Define o alcance protegido do percurso
        reset:
          description: Repõe o alcance protegido para o padrão do mundo

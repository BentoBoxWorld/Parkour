      sethome:
        description: definir o seu ponto de teletransporte para casa
        must-be-on-your-island: '<red>Tem de estar no seu percurso para definir casa!</red>'
        num-homes: '<red>As casas podem ser de 1 a [number].</red>'
        home-set: '<gold>O ponto de casa do seu percurso foi definido para a sua localização atual.</gold>'

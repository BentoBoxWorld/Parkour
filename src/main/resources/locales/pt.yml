        description: definir um nome para o seu percurso
        name-too-short: '<red>Muito curto. O tamanho mínimo é [number] caracteres.</red>'
        name-too-long: '<red>Muito longo. O tamanho máximo é [number] caracteres.</red>'
        name-already-exists: '<red>Já existe um percurso com esse nome!</red>'
        parameters: <nome>
        success: '<green>Definiu com sucesso o nome do seu percurso para </green><aqua>[name]</aqua><green> .</green>'

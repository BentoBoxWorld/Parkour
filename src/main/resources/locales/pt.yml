          not-allowed: '<red>Não é permitido definir a sua casa no Nether.</red>'
          confirmation: '<red>Tem a certeza que quer definir a sua casa no Nether?</red>'
        the-end:
          not-allowed: '<red>Não é permitido definir a sua casa no The End.</red>'
          confirmation: '<red>Tem a certeza que quer definir a sua casa no The End?</red>'
        parameters: '[número da casa]'

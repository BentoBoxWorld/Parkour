        island-coords: 'Coordenadas da área: [xz1] a [xz2]'
        is-spawn: A área é um percurso de spawn
      setrange:
        description: definir o alcance do percurso do jogador
        range-updated: Alcance da área atualizado para [number]
      tp:
        description: teletransportar para o percurso de um jogador
      getrank:
        description: obter a patente de um jogador no seu percurso
        rank-is: '<green>A patente é [rank] no seu percurso.</green>'
      setrank:
        description: definir a patente de um jogador no seu percurso

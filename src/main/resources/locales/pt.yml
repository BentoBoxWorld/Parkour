        cannot-create-island: '<red>Não foi encontrado um local a tempo, tente novamente...</red>'
        unable-create-island: '<red>O seu percurso não pôde ser gerado, contacte um administrador.</red>'
        creating-island: '<green>A encontrar um local para o seu percurso...</green>'
        pasting:
          estimated-time: '<green>Tempo estimado: </green><aqua>[number] </aqua><green>segundos.</green>'
          blocks: '<green>Construir bloco a bloco: </green><aqua>[number] </aqua><green>blocos no total...</green>'
          entities: '<green>Preenchendo com entidades: </green><aqua>[number] </aqua><green>entidades no total...</green>'
          done: '<green>Pronto! O seu percurso está pronto e à espera!</green>'

  checkpoint-set: "<green>Ponto de verificação definido!</green>"
  set-the-end: "<red>Defina a placa de chegada</red>"
  hours: "horas"
  minutes: "minutos"
  seconds: "segundos"
  hours-short: "h"
  minutes-short: "m"
  seconds-short: "s"
  courses:
    description: "Escolha um e tente!"
    gui-title: "Percursos Parkour"
    head-description: "<aqua>[runs] execuções</aqua>"
  top:
    gui-title: "Melhores Classificações de Percursos"
    name-rank: "<aqua>[rank] - </aqua><light_purple>[name]</light_purple>"
    description: "<yellow>[number]</yellow>"
    your-rank: "<green>A sua classificação: [number]</green>"
    beat-previous-time: "<light_purple>Bateu o seu tempo anterior!</light_purple>"
    did-not-beat-previous-time: "<aqua>Não bateu o seu tempo anterior!</aqua>"
  errors:
    not-on-island: "<red>Tem de estar num percurso parkour para fazer isso</red>"
    no-warp: "<red>Este percurso já é privado</red>"
    not-in-run: "<red>Tem de estar a executar um percurso para fazer isso</red>"
  warp:
    set: "<light_purple>Ponto de teletransporte definido! Os jogadores podem ver o seu percurso!</light_purple>"
    replaced: "<yellow>Ponto de teletransporte definido! Ponto anterior desativado!</yellow>"
    removed: "<red>Ponto de teletransporte removido. Os jogadores não verão o seu percurso.</red>"

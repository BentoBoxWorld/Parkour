      no-island: '<red>Não tem um percurso!</red>'
      player-has-island: '<red>O jogador já tem um percurso!</red>'
      player-has-no-island: '<red>Esse jogador não tem um percurso!</red>'
      already-have-island: '<red>Já tem um percurso!</red>'
      no-safe-location: '<red>Nenhuma localização segura encontrada no percurso!</red>'
      not-owner: '<red>Não é o dono da sua equipa!</red>'
  commands:
    parkour:
      courses:
        description: mostrar percursos disponíveis para jogar e teletransportação
      cleartop:
        description: limpar os dez melhores do seu percurso ou remover a pontuação de um jogador
        parameters: <nome do jogador>
      setwarp:
        description: define o ponto de teletransporte e torna o seu percurso público
      warp:
        description: Teletransporte para um percurso por nome ou para o início se estiver num
        parameters: <nome do percurso>
      removewarp:
        description: remove o ponto de teletransporte e torna o seu percurso privado
      help:
        description: Comece um percurso parkour ou teletransporte para o seu percurso
      go:
        parameters: '[número da casa]'
      sethome:
        parameters: '[número da casa]'
      top:
        description: "Mostrar as melhores classificações de percursos"
      quit:
        description: "Parar o cronómetro no percurso atual"

        on-first-login: '<green>Bem-vindo! Começaremos a preparar o seu percurso em alguns segundos.</green>'
        you-can-teleport-to-your-island: '<green>Pode teletransportar-se para o seu percurso quando quiser.</green>'
      info:
        description: mostrar informações sobre o seu percurso ou o percurso do jogador
        parameters: <jogador>
      near:
        description: mostrar o nome dos percursos vizinhos à sua volta
        parameters: ''
        the-following-islands: '<green>Os seguintes percursos estão próximos:</green>'
        syntax: '<gold>[direction]: </gold><green>[name]</green>'
        north: Norte
        south: Sul
        east: Este
        west: Oeste
        no-neighbors: '<red>Não tem percursos vizinhos imediatos!</red>'
      reset:
        description: reiniciar o seu percurso e remover o antigo
        parameters: <blueprint>
        none-left: '<red>Não tem mais reposições!</red>'
        resets-left: '<red>Tem </red><aqua>[number] </aqua><red>reposições restantes</red>'
        confirmation: |-
          <red>Tem a certeza que quer fazer isso?
          </red><red>Todos os membros do percurso serão expulsos, terá de os reinvitar depois.
          </red><red>Não há volta atrás: uma vez eliminado o seu percurso atual, não há <bold>forma </bold></red> <red>de o recuperar mais tarde.</red>

        description: |-
          <green>Ativa/desativa modo criativo
          </green><green>no fim do percurso e
          </green><green>ao entrar na área
          </green>
        name: "Modo Criativo de Parkour"
      ELYTRA:
        description: Alternar uso
      ENDERMAN_GRIEFING:
        description: |-
          <green>Os Endermen podem remover
          </green><green>blocos</green>

  no-end-yet: "<red>Ainda não há ponto de chegada definido.</red>"
  to-start: "<light_purple>Para começar, pise na placa de pressão dourada.</light_purple>"
  session-ended: "<red>A sua sessão de parkour terminou.</red>"
  end: "<green>Fim do percurso parkour!</green>"
  you-took: "<light_purple>Demorou [number]!</light_purple>"

        parameters: '[número da casa]'
        description: teletransportá-lo para o seu percurso
        teleport: '<green>A teletransportá-lo para o seu percurso.</green>'
        teleported: '<green>Teletransportado para a casa </green><yellow>#[number].</yellow>'

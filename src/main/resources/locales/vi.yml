            cant-transfer-to-yourself: '<red>Bạn không thể chuyển quyền sở hữu cho chính mình! </red><gray>(<italic> Thực tế, bạn có thể... Nhưng chúng tôi không muốn bạn làm điều đó. Bởi vì nó vô dụng.</italic></gray> <gray>)</gray>'

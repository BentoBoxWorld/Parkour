  start-removed: "<aqua>Điểm bắt đầu đã bị xóa!</aqua>"
  end-removed: "<aqua>Điểm kết thúc đã bị xóa!</aqua>"
  resetting-start-end: "<yellow>Đang đặt lại điểm bắt đầu và kết thúc!</yellow>"
  start: "<aqua>Bắt đầu parkour!</aqua>"
  no-start-yet: "<red>Chưa có điểm bắt đầu nào được đặt.</red>"
  no-end-yet: "<red>Chưa có điểm kết thúc nào được đặt.</red>"
  to-start: "<light_purple>Để bắt đầu, hãy bước lên tấm áp lực vàng.</light_purple>"
  session-ended: "<red>Phiên parkour của bạn đã kết thúc.</red>"
  end: "<green>Parkour Hoàn Thành!</green>"
  you-took: "<light_purple>Bạn sử dụng [number]!</light_purple>"
  start-before-end: "<aqua>Bạn cần phải bắt đầu trước khi kết thúc!</aqua>"
  checkpoint: "<yellow>Điểm kiểm tra!</yellow>"
  checkpoint-set: "<green>Điểm kiểm tra đã được đặt!</green>"
  set-the-end: "<red>Đặt tấm kết thúc</red>"
  hours: "giờ"
  minutes: "phút"
  seconds: "giây"
  hours-short: "g"
  minutes-short: "p"
  seconds-short: "s"
  courses:
    description: "Chọn một và thử nó!"
    gui-title: "Các Khóa Học Parkour"
    head-description: "<aqua>[runs] lần chơi</aqua>"
  top:
    gui-title: "Xếp Hạng Khóa Học Nhanh Nhất"
    name-rank: "<aqua>[rank] - </aqua><light_purple>[name]</light_purple>"
    description: "<yellow>[number]</yellow>"
    your-rank: "<green>Xếp hạng của bạn: [number]</green>"
    beat-previous-time: "<light_purple>Bạn đã vượt qua thời gian trước đó!</light_purple>"
    did-not-beat-previous-time: "<aqua>Bạn đã không vượt qua thời gian trước đó!</aqua>"
  errors:
    not-on-island: "<red>Bạn phải ở trên một khóa học parkour để làm điều đó</red>"
    no-warp: "<red>Khóa học này đã ở chế độ riêng tư</red>"
    not-in-run: "<red>Bạn phải đang chạy một khóa học để làm điều đó</red>"
  warp:
    set: "<light_purple>Điểm warp đã được đặt! Các cầu thủ bây giờ có thể thấy khóa học của bạn!</light_purple>"
    replaced: "<yellow>Điểm warp đã được đặt! Điểm cũ đã bị vô hiệu hóa!</yellow>"
    removed: "<red>Điểm warp đã bị xóa. Các cầu thủ sẽ không nhìn thấy khóa học của bạn.</red>"
    warping: "<green>Warp đến khóa học!</green>"
    no-warp: "<red>Không có warp nào được đặt cho khóa học này!</red>"
    unknown-course: "<red>Khóa học không xác định!</red>"
  quit:
    success: "<yellow>Bạn đã bỏ cuộc chạy, và có thể chạy lệnh lại</yellow>"
  general:
    errors:
      no-island: '<red>Bạn không có khóa học!</red>'
      player-has-island: '<red>Người chơi đã có khóa học!</red>'
      player-has-no-island: '<red>Người chơi đó không có khóa học!</red>'
      already-have-island: '<red>Bạn đã có khóa học!</red>'
      no-safe-location: '<red>Không tìm thấy vị trí an toàn trong khóa học!</red>'
      not-owner: '<red>Bạn không phải là chủ sở hữu của đội của bạn!</red>'
  commands:
    parkour:
      courses:
        description: hiển thị các khóa học có sẵn để chơi và warp đến
      cleartop:
        description: xóa mười hàng đầu của khóa học của bạn hoặc xóa điểm của một người chơi
        parameters: <tên người chơi>
      setwarp:
        description: đặt điểm warp và làm cho khóa học của bạn công khai
      warp:
        description: Warp đến một khóa học theo tên hoặc đến điểm bắt đầu nếu bạn ở trên một
        parameters: <tên khóa học>
      removewarp:
        description: xóa điểm warp và làm cho khóa học của bạn ở chế độ riêng tư
      help:
        description: Bắt đầu một khóa học parkour hoặc teleport đến khóa học của bạn
      go:
        parameters: '[số nhà]'
      sethome:
        parameters: '[số nhà]'
      top:
        description: "Hiển thị xếp hạng khóa học hàng đầu"
      quit:
        description: "Dừng bộ hẹn giờ trên khóa học hiện tại"
    island:
      go:
        parameters: '[số nhà]'
        description: teleport bạn đến khóa học của bạn
        teleport: '<green>Đang teleport bạn đến khóa học của bạn.</green>'
        teleported: '<green>Đã teleport bạn đến nhà </green><yellow>#[number].</yellow>'
      help:
        description: lệnh parkour chính
      create:
        description: tạo một khóa học, sử dụng blueprint tùy chọn (yêu cầu quyền hạn)
        parameters: <blueprint>
        too-many-islands: "<red>Có quá nhiều khóa học trong thế giới này: không có đủ chỗ để tạo khóa học của bạn.</red>"
        cannot-create-island: '<red>Không thể tìm thấy vị trí kịp thời, vui lòng thử lại...</red>'
        unable-create-island: '<red>Khóa học của bạn không thể được tạo, vui lòng liên hệ với quản trị viên.</red>'
        creating-island: '<green>Đang tìm vị trí cho khóa học của bạn...</green>'
        pasting:
          estimated-time: '<green>Thời gian ước tính: </green><aqua>[number] </aqua><green>giây.</green>'
          blocks: '<green>Xây dựng nó từng khối: </green><aqua>[number] </aqua><green>khối tất cả...</green>'
          entities: '<green>Lấp đầy nó bằng các thực thể: </green><aqua>[number] </aqua><green>thực thể tất cả...</green>'
          done: '<green>Hoàn thành! Khóa học của bạn sẵn sàng và chờ bạn!</green>'
        pick: '<dark_green>Chọn một khóa học</dark_green>'
        unknown-blueprint: '<red>Blueprint đó chưa được tải.</red>'
        on-first-login: '<green>Chào mừng! Chúng tôi sẽ bắt đầu chuẩn bị khóa học của bạn trong vài giây.</green>'
        you-can-teleport-to-your-island: '<green>Bạn có thể teleport đến khóa học của bạn bất cứ khi nào.</green>'
      info:
        description: hiển thị thông tin về khóa học của bạn hoặc khóa học của người chơi
        parameters: <người chơi>
      near:
        description: hiển thị tên của các khóa học lân cận xung quanh bạn
        parameters: ''
        the-following-islands: '<green>Các khóa học sau đây ở gần:</green>'
        syntax: '<gold>[direction]: </gold><green>[name]</green>'
        north: Bắc
        south: Nam
        east: Đông
        west: Tây
        no-neighbors: '<red>Bạn không có khóa học lân cận trực tiếp!</red>'
      reset:
        description: khởi động lại khóa học của bạn và xóa khóa học cũ
        parameters: <blueprint>
        none-left: '<red>Bạn không còn reset nữa!</red>'
        resets-left: '<red>Bạn có </red><aqua>[number] </aqua><red>reset còn lại</red>'
        confirmation: |-
          <red>Bạn có chắc chắn muốn làm điều này không?
          </red><red>Tất cả các thành viên khóa học sẽ bị loại khỏi khóa học, bạn sẽ phải mời lại họ sau này.
          </red><red>Không có quay lại: sau khi khóa học hiện tại của bạn bị xóa, sẽ không có <bold>không </bold></red> <red>cách để lấy lại nó sau này.</red>
        kicked-from-island: '<red>Bạn bị loại khỏi khóa học của bạn trong [gamemode] vì chủ sở hữu đang đặt lại.</red>'
      sethome:
        description: đặt điểm teleport nhà của bạn
        must-be-on-your-island: '<red>Bạn phải ở trên khóa học của bạn để đặt nhà!</red>'
        num-homes: '<red>Nhà có thể là 1 đến [number].</red>'
        home-set: '<gold>Nhà khóa học của bạn đã được đặt ở vị trí hiện tại của bạn.</gold>'
        nether:
          not-allowed: '<red>Bạn không được phép đặt nhà của bạn trong Nether.</red>'
          confirmation: '<red>Bạn có chắc chắn muốn đặt nhà của bạn trong Nether không?</red>'
        the-end:
          not-allowed: '<red>Bạn không được phép đặt nhà của bạn trong End.</red>'
          confirmation: '<red>Bạn có chắc chắn muốn đặt nhà của bạn trong End không?</red>'
        parameters: '[số nhà]'
      setname:
        description: đặt tên cho khóa học của bạn
        name-too-short: '<red>Quá ngắn. Kích thước tối thiểu là [number] ký tự.</red>'
        name-too-long: '<red>Quá dài. Kích thước tối đa là [number] ký tự.</red>'
        name-already-exists: '<red>Đã có một khóa học với tên đó!</red>'
        parameters: <tên>
        success: '<green>Đặt thành công tên khóa học của bạn thành </green><aqua>[name]</aqua><green> .</green>'
      resetname:
        description: đặt lại tên khóa học của bạn
        success: '<green>Đặt lại tên khóa học của bạn thành công.</green>'
      team:
        description: quản lý đội của bạn
        coop:
          description: tạo một người chơi rank coop trên khóa học của bạn
          parameters: <người chơi>
          cannot-coop-yourself: '<red>Bạn không thể coop chính mình!</red>'
          already-has-rank: '<red>Người chơi đã có rank!</red>'
          you-are-a-coop-member: '<dark_green>Bạn được coop bởi </dark_green><aqua>[name]</aqua><green>.</green>'
          success: '<green>Bạn đã coop </green><aqua>[name]</aqua><green>.</green>'
          name-has-invited-you: '<green>[name] đã mời bạn tham gia thành viên coop khóa học của họ.</green>'

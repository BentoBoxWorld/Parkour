        player-unbanned: '<aqua>[name]</aqua><green>  hiện không bị cấm khỏi khóa học của bạn.</green>'
        you-are-unbanned: '<aqua>[name]</aqua><green>  đã hủy cấm bạn khỏi khóa học của họ!</green>'
      banlist:
        description: liệt kê các người chơi bị cấm
        noone: '<green>Không ai bị cấm trên khóa học này.</green>'

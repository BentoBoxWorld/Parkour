          cancel:
            description: hủy lời mời đang chờ xử lý để tham gia khóa học của bạn
        leave:
          cannot-leave: '<red>Chủ sở hữu không thể rời đi! Trở thành thành viên trước tiên, hoặc loại bỏ tất cả các thành viên.</red>'
          description: rời khỏi khóa học của bạn
          left-your-island: '<red>[name] </red><red>đã rời khỏi khóa học của bạn</red>'
          success: '<green>Bạn đã rời khỏi khóa học này.</green>'
        kick:

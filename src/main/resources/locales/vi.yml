          name-is-the-owner: '<green>[name] hiện là chủ sở hữu khóa học!</green>'
          parameters: <người chơi>
          you-are-the-owner: '<green>Bạn hiện là chủ sở hữu khóa học!</green>'
      ban:
        description: cấm một người chơi khỏi khóa học của bạn
        parameters: <người chơi>
        cannot-ban-yourself: '<red>Bạn không thể cấm chính mình!</red>'
        cannot-ban: '<red>Người chơi đó không thể bị cấm.</red>'
        cannot-ban-member: '<red>Loại bỏ thành viên đội trước, sau đó cấm.</red>'
        cannot-ban-more-players: '<red>Bạn đã đạt đến giới hạn cấm, bạn không thể cấm thêm người chơi từ khóa học của bạn.</red>'
        player-already-banned: '<red>Người chơi đã bị cấm.</red>'
        player-banned: '<aqua>[name]</aqua><red>  hiện bị cấm khỏi khóa học của bạn.</red>'
        owner-banned-you: '<aqua>[name]</aqua><red>  đã cấm bạn khỏi khóa học của họ!</red>'
        you-are-banned: '<aqua>Bạn bị cấm khỏi khóa học này!</aqua>'
      unban:

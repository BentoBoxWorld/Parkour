          parameters: <người chơi>
          failure: '<red>Người chơi không thể được nâng cấp nữa!</red>'
          success: '<green>Nâng cấp [name] lên [rank]</green>'
        setowner:
          description: chuyển quyền sở hữu khóa học của bạn cho một thành viên

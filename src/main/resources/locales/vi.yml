          parameters: <người chơi>
          you-can-invite: '<green>Bạn có thể mời [number] người chơi nữa.</green>'
          accept:
            description: chấp nhận lời mời
            you-joined-island: '<green>Bạn đã tham gia một khóa học! Sử dụng </green><aqua>/[label] team </aqua><green>để xem các thành viên khác.</green>'
            name-joined-your-island: '<green>[name] đã tham gia khóa học của bạn!</green>'
            confirmation: |-
              <red>Bạn có chắc chắn muốn chấp nhận lời mời này không?
              </red><red><bold>Bạn sẽ <underlined>MẤT </underlined></bold></red><red><bold>khóa học hiện tại của bạn!</bold></red>
          reject:
            description: từ chối lời mời
            you-rejected-invite: '<green>Bạn đã từ chối lời mời tham gia một khóa học.</green>'

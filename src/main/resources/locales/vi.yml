          name-has-invited-you: '<green>[name] đã mời bạn tham gia thành viên đáng tin cậy khóa học của họ.</green>'
          player-already-trusted: '<red>Người chơi đã được tin tưởng!</red>'
          you-are-trusted: '<dark_green>Bạn được tin tưởng bởi </dark_green><aqua>[name]</aqua><green> !</green>'
          success: '<green>Bạn đã tin tưởng </green><aqua>[name]</aqua><green> .</green>'
          is-full: '<red>Bạn không thể tin tưởng bất cứ ai khác.</red>'

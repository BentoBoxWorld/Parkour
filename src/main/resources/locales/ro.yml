        description: arată cursurile disponibile pentru a juca și se teleporta
      cleartop:
        description: șterge top zece al cursului tău sau elimină scorul unui jucător
        parameters: <nume jucător>
      setwarp:
        description: stabilește punctul de teleport și face cursul tău public
      warp:

        unable-create-island: '<red>Cursul tău nu a putut fi generat, contactează un administrator.</red>'
        creating-island: '<green>Căutând un loc pentru cursul tău...</green>'
        pasting:
          estimated-time: '<green>Timp estimat: </green><aqua>[number] </aqua><green>secunde.</green>'
          blocks: '<green>Construind bloc cu bloc: </green><aqua>[number] </aqua><green>blocuri în total...</green>'
          entities: '<green>Umplând cu entități: </green><aqua>[number] </aqua><green>entități în total...</green>'
          done: '<green>Gata! Cursul tău este gata și te așteaptă!</green>'

    description: "Alege-ți pe și încearcă!"
    gui-title: "Cursuri de Parkour"
    head-description: "<aqua>[runs] încercări</aqua>"
  top:
    gui-title: "Clasament Cursuri Cel Mai Rapid"
    name-rank: "<aqua>[rank] - </aqua><light_purple>[name]</light_purple>"
    description: "<yellow>[number]</yellow>"
    your-rank: "<green>Rangul tău: [number]</green>"
    beat-previous-time: "<light_purple>Ți-ai depășit tiempo anterior!</light_purple>"
    did-not-beat-previous-time: "<aqua>Nu ți-ai depășit tiempo anterior!</aqua>"
  errors:
    not-on-island: "<red>Trebuie să fii pe un curs de parkour pentru a face asta</red>"
    no-warp: "<red>Acest curs este deja privat</red>"
    not-in-run: "<red>Trebuie să fii în curs în acest moment pentru a face asta</red>"
  warp:
    set: "<light_purple>Punct de teleport setat! Jucătorii pot acum vedea cursul tău!</light_purple>"
    replaced: "<yellow>Punct de teleport setat! Punct vechi dezactivat!</yellow>"
    removed: "<red>Punct de teleport eliminat. Jucătorii nu vor mai vedea cursul tău.</red>"

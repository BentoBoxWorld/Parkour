        syntax: '<gold>[direction]: </gold><green>[name]</green>'
        north: Nord
        south: Sud
        east: Est
        west: Vest
        no-neighbors: '<red>Nu ai cursuri vecine imediate!</red>'
      reset:
        description: reinițializează-ți cursul și elimină cel vechi
        parameters: <plan>
        none-left: '<red>Nu mai ai reinițializări!</red>'
        resets-left: '<red>Ai încă </red><aqua>[number] </aqua><red>reinițializări</red>'

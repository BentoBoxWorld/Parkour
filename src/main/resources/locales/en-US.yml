# 
# This is a YML file. Be careful when editing. Check your edits in a YAML checker like    #
# the one at http://yaml-online-parser.appspot.com                                        #
parkour:
  start-set: "<green>Start set!</green>"
  end-set: "<green>End set!</green>"
  already-set: "<red>Start and End already set! Break one to reset.</red>"
  start-removed: "<aqua>Start removed!</aqua>"
  end-removed: "<aqua>End removed!</aqua>"
  resetting-start-end: "<yellow>Resetting start and end points!</yellow>"
  start: "<aqua>Parkour start!</aqua>"
  no-start-yet: "<red>There is no start set up yet.</red>"
  no-end-yet: "<red>There is no end set up yet.</red>"
  to-start: "<light_purple>To start, step on the gold pressure plate.</light_purple>"
  session-ended: "<red>You parkour session ended.</red>"
  end: "<green>Parkour End!</green>"
  you-took: "<light_purple>You took [number]!</light_purple>"
  start-before-end: "<aqua>You need to start before ending!</aqua>"
  checkpoint: "<yellow>Checkpoint!</yellow>"
  checkpoint-set: "<green>Checkpoint set!</green>"
  set-the-end: "<red>Set the end plate</red>"
  hours: "hours"
  minutes: "minutes"
  seconds: "seconds"
  hours-short: "h"
  minutes-short: "m"
  seconds-short: "s"
  courses:
    description: "Pick one and try it!"
    gui-title: "Parkour Courses"
    head-description: "<aqua>[runs] runs</aqua>"
  top:
    gui-title: "Fastest Course Rankings"
    name-rank: "<aqua>[rank] - </aqua><light_purple>[name]</light_purple>"
    description: "<yellow>[number]</yellow>"
    your-rank: "<green>Your rank: [number]</green>"
    beat-previous-time: "<light_purple>You beat your previous time!</light_purple>"
    did-not-beat-previous-time: "<aqua>You didn't beat your previous time!</aqua>"
  errors:
    not-on-island: "<red>You must be on an parkour course to do that</red>"
    no-warp: "<red>This course is already private</red>"
    not-in-run: "<red>You must currently be running a course to do that</red>"
  warp:
    set: "<light_purple>Warp spot set! Players can now see your course!</light_purple>"
    replaced: "<yellow>Warp spot set! Old spot deactivated!</yellow>"
    removed: "<red>Warp spot removed. Players will not see your course.</red>"
    warping: "<green>Warping to the course!</green>"
    no-warp: "<red>There is no warp set for this course!</red>"
    unknown-course: "<red>Unknown course!</red>"
  quit:
    success: "<yellow>You have now quit your run, and can run commands again</yellow>"
  general:
    errors:
      no-island: '<red>You do not have a course!</red>'
      player-has-island: '<red>Player already has a course!</red>'
      player-has-no-island: '<red>That player has no course!</red>'
      already-have-island: '<red>You already have a course!</red>'
      no-safe-location: '<red>No safe location found in course!</red>'
      not-owner: '<red>You are not the owner of your team!</red>'
  commands:
    parkour:
      courses:
        description: show courses available to play and warp to
      cleartop:
        description: clear your course's top ten or remove a player's score from it
        parameters: <player name>
      setwarp:
        description: sets the warp spot and makes your course public
      warp:
        description: Warp to a course by name or to the start if you are on one
        parameters: <course name>
      removewarp:
        description: removes the warp spot and makes your course private
      help:
        description: Start a parkour course or teleport to your course
      go:
        parameters: '[home number]'
      sethome:
        parameters: '[home number]'
      top:
        description: "Show the top course rankings"
      quit:
        description: "Stop the timer on the current course"
    island:
      go:
        parameters: '[home number]'
        description: teleport you to your course
        teleport: '<green>Teleporting you to your course.</green>'
        teleported: '<green>Teleported you to home </green><yellow>#[number].</yellow>'
      help:
        description: the main parkour command
      create:
        description: create an course, using optional blueprint (requires permission)
        parameters: <blueprint>
        too-many-islands: "<red>There are too many courses in this world: there isn't enough room for yours to be created.</red>"
        cannot-create-island: '<red>A spot could not be found in time, please try again...</red>'
        unable-create-island: '<red>Your course could not be generated, please contact an administrator.</red>'
        creating-island: '<green>Finding a spot for your course...</green>'
        pasting:
          estimated-time: '<green>Estimated time: </green><aqua>[number] </aqua><green>seconds.</green>'
          blocks: '<green>Building it block by block: </green><aqua>[number] </aqua><green>blocks in all...</green>'
          entities: '<green>Filling it with entities: </green><aqua>[number] </aqua><green>entities in all...</green>'
          done: '<green>Done! Your course is ready and waiting for you!</green>'
        pick: '<dark_green>Pick a course</dark_green>'
        unknown-blueprint: '<red>That blueprint has not been loaded yet.</red>'
        on-first-login: '<green>Welcome! We will start preparing your course in a few seconds.</green>'
        you-can-teleport-to-your-island: '<green>You can teleport to your course when you want.</green>'
      info:
        description: display info about your course or the player's course
        parameters: <player>
      near:
        description: show the name of neighboring courses around you
        parameters: ''
        the-following-islands: '<green>The following courses are nearby:</green>'
        syntax: '<gold>[direction]: </gold><green>[name]</green>'
        north: North
        south: South
        east: East
        west: West
        no-neighbors: '<red>You have no immediate neighboring courses!</red>'
      reset:
        description: restart your course and remove the old one
        parameters: <blueprint>
        none-left: '<red>You have no more resets left!</red>'
        resets-left: '<red>You have </red><aqua>[number] </aqua><red>resets left</red>'
        confirmation: |-
          <red>Are you sure you want to do this?
          </red><red>All course members will be kicked from the course, you will have to reinvite them afterwards.
          </red><red>There is no going back: once your current course is deleted, there will be <bold>no </bold></red> <red>way to retrieve it later on.</red>
        kicked-from-island: '<red>You are kicked from your course in [gamemode] because the owner is resetting it.</red>'
      sethome:
        description: set your home teleport point
        must-be-on-your-island: '<red>You must be on your course to set home!</red>'
        num-homes: '<red>Homes can be 1 to [number].</red>'
        home-set: '<gold>Your course home has been set to your current location.</gold>'
        nether:
          not-allowed: '<red>You are not allowed to set your home in the Nether.</red>'
          confirmation: '<red>Are you sure you want to set your home in the Nether?</red>'
        the-end:
          not-allowed: '<red>You are not allowed to set your home in the End.</red>'
          confirmation: '<red>Are you sure you want to set your home in the End?</red>'
        parameters: '[home number]'
      setname:
        description: set a name for your course
        name-too-short: '<red>Too short. Minimum size is [number] characters.</red>'
        name-too-long: '<red>Too long. Maximum size is [number] characters.</red>'
        name-already-exists: '<red>There is already an course with that name!</red>'
        parameters: <name>
        success: '<green>Successfully set your course''s name to </green><aqua>[name]</aqua><green> .</green>'
      resetname:
        description: reset your course name
        success: '<green>Successfully reset your course name.</green>'
      team:
        description: manage your team
        coop:
          description: make a player coop rank on your course
          parameters: <player>
          cannot-coop-yourself: '<red>You cannot coop yourself!</red>'
          already-has-rank: '<red>Player already has a rank!</red>'
          you-are-a-coop-member: '<dark_green>You were cooped by </dark_green><aqua>[name]</aqua><green>.</green>'
          success: '<green>You cooped </green><aqua>[name]</aqua><green>.</green>'
          name-has-invited-you: '<green>[name] has invited you to join be a coop member of their course.</green>'
        uncoop:
          description: remove a coop rank from player
          parameters: <player>
          cannot-uncoop-yourself: '<red>You cannot uncoop yourself!</red>'
          cannot-uncoop-member: '<red>You cannot uncoop a team member!</red>'
          player-not-cooped: '<red>Player is not cooped!</red>'
          you-are-no-longer-a-coop-member: '<red>You are no longer a coop member of [name]''s course.</red>'
          all-members-logged-off: '<red>All course members logged off so you are no longer a coop member of [name]''s course.</red>'
          success: '<aqua>[name] </aqua><green>is no longer a coop member of your course.</green>'
          is-full: '<red>You cannot coop anyone else.</red>'
        trust:
          description: give a player trusted rank on your course
          parameters: <player>
          trust-in-yourself: '<red>Trust in yourself!</red>'
          name-has-invited-you: '<green>[name] has invited you to join be a trusted member of their course.</green>'
          player-already-trusted: '<red>Player is already trusted!</red>'
          you-are-trusted: '<dark_green>You are trusted by </dark_green><aqua>[name]</aqua><green> !</green>'
          success: '<green>You trusted </green><aqua>[name]</aqua><green> .</green>'
          is-full: '<red>You cannot trust anyone else.</red>'
        invite:
          description: invite a player to join your course
          invitation-sent: '<green>Invitation sent to </green><aqua>[name]</aqua><green>.</green>'
          removing-invite: '<red>Removing invite.</red>'
          name-has-invited-you: '<green>[name] has invited you to join their course.</green>'
          to-accept-or-reject: '<green>Do /[label] team accept to accept, or /[label] team reject to reject</green>'
          you-will-lose-your-island: '<red>WARNING! You will lose your course if you accept!</red>'
          errors:
            cannot-invite-self: '<red>You cannot invite yourself!</red>'
            cooldown: '<red>You cannot invite that person for another [number] seconds.</red>'
            island-is-full: '<red>Your course is full, you can''t invite anyone else.</red>'
            none-invited-you: '<red>No one invited you :c.</red>'
            you-already-are-in-team: '<red>You are already on a team!</red>'
            already-on-team: '<red>That player is already on a team!</red>'
            invalid-invite: '<red>That invite is no longer valid, sorry.</red>'
            you-have-already-invited: '<red>You have already invited that player!</red>'
          parameters: <player>
          you-can-invite: '<green>You can invite [number] more players.</green>'
          accept:
            description: accept an invitation
            you-joined-island: '<green>You joined an course! Use </green><aqua>/[label] team </aqua><green>to see the other members.</green>'
            name-joined-your-island: '<green>[name] joined your course!</green>'
            confirmation: |-
              <red>Are you sure you want to accept this invite?
              </red><red><bold>You will <underlined>LOSE </underlined></bold></red><red><bold>your current course!</bold></red>
          reject:
            description: reject an invitation
            you-rejected-invite: '<green>You rejected the invitation to join an course.</green>'
            name-rejected-your-invite: '<red>[name] rejected your course invite!</red>'
          cancel:
            description: cancel the pending invite to join your course
        leave:
          cannot-leave: '<red>Owners cannot leave! Become a member first, or kick all members.</red>'
          description: leave your course
          left-your-island: '<red>[name] </red><red>left your course</red>'
          success: '<green>You left this course.</green>'
        kick:
          description: remove a member from your course
          parameters: <player>
          owner-kicked: '<red>The owner kicked you from the course in [gamemode]!</red>'
          cannot-kick: '<red>You cannot kick yourself!</red>'
          success: '<aqua>[name] </aqua><green>has been kicked from your course.</green>'
        demote:
          description: demote a player on your course down a rank
          parameters: <player>
          errors:
            cant-demote-yourself: '<red>You can''t demote yourself!</red>'
          failure: '<red>Player cannot be demoted any further!</red>'
          success: '<green>Demoted [name] to [rank]</green>'
        promote:
          description: promote a player on your course up a rank
          parameters: <player>
          failure: '<red>Player cannot be promoted any further!</red>'
          success: '<green>Promoted [name] to [rank]</green>'
        setowner:
          description: transfer your course ownership to a member
          errors:
            cant-transfer-to-yourself: '<red>You can''t transfer ownership to yourself! </red><gray>(<italic> Well, in fact, you could... But we don''t want you to. Because it''s useless.</italic></gray> <gray>)</gray>'
            target-is-not-member: '<red>That player is not part of your course team!</red>'
          name-is-the-owner: '<green>[name] is now the course owner!</green>'
          parameters: <player>
          you-are-the-owner: '<green>You are now the course owner!</green>'
      ban:
        description: ban a player from your course
        parameters: <player>
        cannot-ban-yourself: '<red>You cannot ban yourself!</red>'
        cannot-ban: '<red>That player cannot be banned.</red>'
        cannot-ban-member: '<red>Kick the team member first, then ban.</red>'
        cannot-ban-more-players: '<red>You reached the ban limit, you cannot ban any more players from your course.</red>'
        player-already-banned: '<red>Player is already banned.</red>'
        player-banned: '<aqua>[name]</aqua><red>  is now banned from your course.</red>'
        owner-banned-you: '<aqua>[name]</aqua><red>  banned you from their course!</red>'
        you-are-banned: '<aqua>You are banned from this course!</aqua>'
      unban:
        description: unban a player from your course
        parameters: <player>
        cannot-unban-yourself: '<red>You cannot unban yourself!</red>'
        player-not-banned: '<red>Player is not banned.</red>'
        player-unbanned: '<aqua>[name]</aqua><green>  is now unbanned from your course.</green>'
        you-are-unbanned: '<aqua>[name]</aqua><green>  unbanned you from their course!</green>'
      banlist:
        description: list banned players
        noone: '<green>No one is banned on this course.</green>'
        the-following: '<aqua>The following players are banned:</aqua>'
        names: '<red>[line]</red>'
        you-can-ban: '<aqua>You can ban up to </aqua><yellow>[number] </yellow><aqua>more players.</aqua>'
      settings:
        description: display course settings
      language:
        description: select language
        parameters: '[language]'
        not-available: '<red>This language is not available.</red>'
        already-selected: '<red>You are already using this language.</red>'
      expel:
        description: expel a player from your course
        parameters: <player>
        cannot-expel-yourself: '<red>You cannot expel yourself!</red>'
        cannot-expel: '<red>That player cannot be expelled.</red>'
        cannot-expel-member: '<red>You cannot expel a team member!</red>'
        not-on-island: '<red>That player is not on your course!</red>'
        player-expelled-you: '<aqua>[name]</aqua><red>  expelled you from the course!</red>'
        success: '<green>You expelled </green><aqua>[name] </aqua><green>from the course.</green>'
    admin:
      team:
        add:
          name-has-island: '<red>[name] has a course. Unregister or delete them first!</red>'
        setowner:
          description: transfers course ownership to the player
          already-owner: '<red>Player is already the owner of this course!</red>'
      range:
        description: Admin course range command
        display:
          description: Show/hide course range indicators
          hint: |-
            <red>Red Barrier icons </red><white>show the current protected range limit.
            </white><gray>Gray Particles </gray><white>show the max limit.
            </white><green>Green Particles </green><white>show the default protected range if the protection range differs from it.</white>
        set:
          description: Sets the course protected range
        reset:
          description: Resets the protected range to the world default
      register:
        parameters: <player>
        description: register player to unowned course you are in
        registered-island: '<green>Registered player to course at [xyz].</green>'
        already-owned: '<red>Area is already owned by another player!</red>'
        no-island-here: '<red>There is no player course here. Confirm to make one.</red>'
        in-deletion: '<red>This space is currently being regenerated. Try later.</red>'
      unregister:
        description: unregister owner from a course, but keep course blocks as-is
        unregistered-island: '<green>Unregistered player from course at [xyz].</green>'
      info:
        description: get info on where you are or on player
        no-island: '<red>You are not in a registered course right now...</red>'
        island-location: 'Area location: [xyz]'
        island-coords: 'Area coordinates: [xz1] to [xz2]'
        is-spawn: Area is a spawn island
      setrange:
        description: set the range of player's course
        range-updated: Area range updated to [number]
      tp:
        description: teleport to a player's course
      getrank:
        description: get a player's rank in their course
        rank-is: '<green>Rank is [rank] in their course.</green>'
      setrank:
        description: set a player's rank in their course
      setspawn:
        description: set a course as spawn for this world
        already-spawn: '<red>This course is already a spawn!</red>'
        no-island-here: '<red>There is no registered course here.</red>'
        confirmation: '<red>Are you sure you want to set this course as the spawn for this world?</red>'
      delete:
        description: deletes a player and regenerates their course
        deleted-island: '<green>Area at </green><yellow>[xyz] </yellow><green>has been successfully regenerated.</green>'
  protection:
    flags:
      PARKOUR_CREATIVE:
        description: |-
          <green>Toggles entering creative mode
          </green><green>at end of course and
          </green><green>entering the island
          </green>
        name: "Parkour Creative Mode"
      ELYTRA:
        description: Toggle use
      ENDERMAN_GRIEFING:
        description: |-
          <green>Endermen can remove
          </green><green>blocks</green>
      ENTER_EXIT_MESSAGES:
        description: Display entry and exit messages
        island: "[name]'s course"
        name: Enter/Exit messages
        now-entering: '<green>Now entering </green><aqua>[name]</aqua><green> .</green>'
        now-entering-your-island: '<green>Now entering your course.</green>'
        now-leaving: '<green>Now leaving </green><aqua>[name]</aqua><green> .</green>'
        now-leaving-your-island: '<green>Now leaving your course.</green>'
      GEO_LIMIT_MOBS:
        description: |-
          <green>Remove mobs that go
          </green><green>outside protected
          </green><green>player space</green>
        name: '<yellow>Limit mobs to player course</yellow>'
      ISLAND_RESPAWN:
        description: |-
          <green>Players respawn
          </green><green>in their course</green>
        name: Area respawn
      LOCK:
        name: Lock player course
      OFFLINE_REDSTONE:
        description: "<green>When disabled, redstone\n</green><green>will not operate in courses\n</green><green>where all members are offline.\n</green><green>May help reduce lag.   </green>"
      PISTON_PUSH:
        description: |-
          <green>Allow pistons to push
          </green><green>blocks outside a player's course</green>
      PVP_OVERWORLD:
        description: |-
          <red>Enable/Disable PVP
          </red><red>in protected course.</red>
      REMOVE_MOBS:
        description: |-
          <green>Remove monsters when
          </green><green>teleporting to a course</green>
      PREVENT_TELEPORT_WHEN_FALLING:
        description: |-
          <green>Prevent players from teleporting
          </green><green>if they are falling.</green>
        hint: '<red>You cannot teleport while you are falling!</red>'
    locked: '<red>This course is locked!</red>'
    protected: '<red>Area protected: [description]</red>'
    panel:
      PROTECTION:
        title: '<gold>Protection</gold>'
        description: |-
          <green>Protection settings
          </green><green>for this course</green>
      SETTING:
        description: |-
          <green>General settings
          </green><green>for this course</green>

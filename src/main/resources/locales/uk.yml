        you-can-teleport-to-your-island: '<green>Ви можете телепортуватися на ваш маршрут коли захочете.</green>'
      info:
        description: показати інформацію про ваш маршрут або маршрут гравця
        parameters: <гравець>
      near:
        description: показати назву сусідніх маршрутів навколо вас
        parameters: ''
        the-following-islands: '<green>Поруч знаходяться такі маршрути:</green>'

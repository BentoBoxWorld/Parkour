      courses:
        description: mostrar percursos disponíveis para jogar e teletransporte
      cleartop:
        description: limpar os dez melhores do seu percurso ou remover a pontuação de um jogador
        parameters: <nome do jogador>
      setwarp:
        description: define o ponto de teletransporte e torna seu percurso público
      warp:
